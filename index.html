<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checklist Collection</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#003c64">
<link rel="icon" href="/icons/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Checklists">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div class="app">
    <nav class="app-menu-bar" aria-label="Application menu">
      <img class="menu-bar-logo" src="/assets/Cypress_Logo.png" alt="Cypressili">
      <span class="menu-bar-divider"></span>
      <div class="menu-item">
        <button class="menu-trigger" type="button" aria-haspopup="true" aria-expanded="false">Collection</button>
        <div class="menu-dropdown" role="menu" hidden>
          <button id="exportCollectionBtn" class="menu-dropdown-item" type="button" role="menuitem">Export collection…</button>
          <label class="menu-dropdown-item" role="menuitem">Import collection…
            <input id="importCollectionInput" type="file" accept="application/json,.json" hidden>
          </label>
        </div>
      </div>
      <div class="menu-item">
        <button class="menu-trigger" type="button" aria-haspopup="true" aria-expanded="false">Templates</button>
        <div class="menu-dropdown" role="menu" hidden>
          <button id="openTemplateLibraryBtn" class="menu-dropdown-item" type="button" role="menuitem">Template library</button>
          <button id="saveTemplateBtn" class="menu-dropdown-item" type="button" role="menuitem">Save as template</button>
          <label class="menu-dropdown-item" role="menuitem">Import template…
            <input id="importTemplateInput" type="file" accept="application/json,.json" hidden>
          </label>
        </div>
      </div>
      <div class="menu-item">
        <button class="menu-trigger" type="button" aria-haspopup="true" aria-expanded="false">Checklist</button>
        <div class="menu-dropdown" role="menu" hidden>
          <button id="renameChecklistBtn" class="menu-dropdown-item" type="button" role="menuitem">Rename</button>
          <button id="duplicateChecklistBtn" class="menu-dropdown-item" type="button" role="menuitem">Duplicate</button>
          <button id="deleteChecklistBtn" class="menu-dropdown-item" type="button" role="menuitem">Delete checklist</button>
        </div>
      </div>
      <div class="menu-spacer"></div>
      <span id="autosaveStamp" class="autosave-stamp" aria-live="polite"></span>
      <button id="themeToggle" class="theme-toggle" type="button">Instrument</button>
    </nav>

    <div class="tab-bar" id="tabBar" role="tablist" aria-label="Checklists"></div>

    <div class="sheet">
      <div class="checklist-subheader">
        <input id="collectionTitleInput" class="collection-eyebrow-input" value="Site Inspection Collection" aria-label="Collection name">
        <input id="checklistTitleInput" class="checklist-title-input" aria-label="Checklist title">
        <div class="meta-row">
          <label class="meta-field">Inspector
            <input id="inspectorInput" type="text" placeholder="Name">
          </label>
          <label class="meta-field">Date
            <input id="dateInput" type="date">
          </label>
          <div class="meta-spacer"></div>
          <div class="progress-block">
            <div class="progress-label">
              <span>Complete</span>
              <span id="progressCount" class="progress-count">0 / 0</span>
            </div>
            <div class="progress-track">
              <div id="progressFill" class="progress-fill" role="progressbar" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
                <span id="progressSr" class="sr-only"></span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <ol id="itemList" class="item-list"></ol>

      <div class="add-row">
        <input id="newItemLabel" type="text" placeholder="New item label" maxlength="140">
        <span class="add-row-spacer"></span>
        <div class="type-select" role="group" aria-label="Response type for new item">
          <button type="button" class="type-btn active" data-type="checkbox">Check</button>
          <button type="button" class="type-btn" data-type="text">Text</button>
          <button type="button" class="type-btn" data-type="photo">Photo</button>
          <button type="button" class="type-btn" data-type="signoff">Sign-off</button>
          <button type="button" class="type-btn" data-type="section">Section</button>
        </div>
      </div>
    </div>

    <div class="checklist-footer">
      <span id="remainingCount" class="remaining-count"></span>
      <div class="actions-row-group">
        <button id="resetBtn" class="btn-text" type="button">Clear responses</button>
        <button id="exportPdfBtn" class="btn-outline" type="button">Export PDF</button>
        <button id="lockChecklistBtn" class="btn-filled" type="button">Lock checklist</button>
      </div>
    </div>
  </div>

  <input id="photoFileInput" type="file" accept="image/*" capture="environment" hidden>

  <div id="templateLibraryOverlay" class="modal-overlay" hidden>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="templateLibraryTitle">
      <div class="modal-panel-header">
        <h2 id="templateLibraryTitle">Template Library</h2>
        <button id="closeTemplateLibraryBtn" class="modal-close" type="button" aria-label="Close">×</button>
      </div>
      <div class="modal-panel-toolbar">
        <button id="exportAllTemplatesBtn" class="btn-ghost" type="button">Export all templates…</button>
      </div>
      <div id="templateLibraryList" class="template-library-list"></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
